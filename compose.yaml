services:
  db:
    image: postgres:17
    container_name: kino-postgres
    environment:
      POSTGRES_DB: kino
      POSTGRES_USER: kino_user
      POSTGRES_PASSWORD: kino_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kino_user -d kino" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kino-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker, the database is reachable under its service name "db", not under localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kino
    ports:
      - "8080:8080"

volumes:
  postgres_data: