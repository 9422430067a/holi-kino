services:
  db:
    image: postgres:17
    container_name: kino-postgres
    environment:
      POSTGRES_DB: kino
      POSTGRES_USER: kino_user
      POSTGRES_PASSWORD: kino_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino_user -d kino"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
